<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body class="container">
    <div class="heading">HOGWARTS SCHOOL -  Sorting Ceremony</div>
    <div class="border-bottom">
        <p class="sub-heading">The Sorting Hat</p>
        <img src="assets/sorting_hat.jpg" class="img-styling" />
        <p class="sub-heading">Where do you belong?</p>
        <p class="section-text">Every wizard has a place. Discover yours.</p>
    </div>
    <div>
        <p class="input-label">YOUR NAME, YOUNG WIZARD</p>
        <div id="hogwarts">
        </div>
    </div>
    <div class="border-top">
        <p class="sub-heading">Four Houses</p>
        <div class="cards">
            <div class="g-house">
                <img src="assets/gryffindor.jpg" class="img-house" />
                <p class="sub-heading padding-0">GRYFFINDOR</p>
                <p class="section-text">Bravery · Courage</p>
            </div>
            <div class="s-house">
                <img src="assets/sytherin.jpg" class="img-house" />
                <p class="sub-heading padding-0">SLYTHERIN</p>
                <p class="section-text">Ambition · Cunning</p>
            </div>
            <div class="r-house">
                <img src="assets/ravenclaw.jpg" class="img-house" />
                <p class="sub-heading padding-0">RAVENCLAW</p>
                <p class="section-text">Wisdom · Creativity</p>
            </div>
            <div class="h-house">
                <img src="assets/hufflepuff.jpg" class="img-house" />
                <p class="sub-heading padding-0">HUFFLEPUFF</p>
                <p class="section-text">Bravery · Courage</p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
